kind = "web"
previewPath = "/"
title = "MSTS Client Dashboard"
version = "1.0.0"
id = "artifacts/msts-dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19930

[services.development]
run = "pnpm --filter @workspace/msts-dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/msts-dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/msts-dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19930"
BASE_PATH = "/"
